[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "prague"
optimizer = true
optimizer_runs = 200

# test/control/ holds deliberately broken delegates. Their suites are EXPECTED to fail.
#   forge test --match-contract Control_       -> the red run (demo)
#   forge test --no-match-contract Control_    -> everything that must stay green

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[lint]
# Test fixtures mimic real tokens/sweepers on purpose (lowercase ERC-20 metadata, unchecked transfer).
ignore = ["test/mocks/MockToken.sol", "test/control/SweeperLike.sol"]
# Inline modifiers and plain keccak256 on purpose: this is a reference to be read, gas and size are secondary.
exclude_lints = ["unwrapped-modifier-logic", "asm-keccak256"]
